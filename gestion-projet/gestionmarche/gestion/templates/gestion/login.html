{% extends 'gestion/base.html' %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <h2>Connexion</h2>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                {{ form.as_p }}
            </div>

            <button type="submit">Se connecter</button>

        </form>

    </div>

</div>

{% endblock %}
